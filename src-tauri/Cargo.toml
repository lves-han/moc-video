[package]
name = "yingxiang-video"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
name = "yingxiang_video"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = ["codegen"] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
t01-automation = []
