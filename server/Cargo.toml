[package]
name = "moc-service"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
hickory-resolver = "=0.26.3"
moc-core = { path = "../crates/moc-core" }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "gzip", "json", "query"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
