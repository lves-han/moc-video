[package]
name = "mkv-remux-spike"
version = "0.1.0"
edition = "2024"
publish = false

# T0.43 feasibility spike. Linking modes:
#   default        system FFmpeg via pkg-config (logic check only)
#   --features bundled   ffmpeg-sys-next compiles full FFmpeg from source, static, LGPL
#   --features static    FFMPEG_DIR points at the trimmed build from build_ffmpeg.py, static
[dependencies]
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format", "software-resampling"] }

[features]
bundled = ["ffmpeg-next/build"]
static = ["ffmpeg-next/static"]

[workspace]
